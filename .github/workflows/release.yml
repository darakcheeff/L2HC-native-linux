name: Build & Release Multi-Distro DEB Packages

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  release:
    types: [published]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "debian:10"
            tag: "debian10"
          - image: "debian:11"
            tag: "debian11"
          - image: "debian:12"
            tag: "debian12"
          - image: "debian:13"
            tag: "debian13"
          - image: "ubuntu:20.04"
            tag: "ubuntu20.04"
          - image: "ubuntu:22.04"
            tag: "ubuntu22.04"
          - image: "ubuntu:24.04"
            tag: "ubuntu24.04"
          - image: "ubuntu:devel"
            tag: "ubuntu26.04"

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian package
        run: |
          bash scripts/build_distro_deb.sh ${{ matrix.tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.tag }}
          path: dist/l2hc-native-linux_1.0.0_${{ matrix.tag }}_amd64.deb
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: all_packages
          pattern: deb-*
          merge-multiple: true

      - name: List downloaded packages
        run: |
          ls -la all_packages/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_packages/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
