name: Build & Release Universal DEB Packages

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  release:
    types: [published]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universal:
    name: Build Universal (Multi-ABI & DKMS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev

      - name: Build Multi-ABI & DKMS Packages
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          if [ -z "${TAG_VER}" ] || [ "${TAG_VER}" = "${GITHUB_REF}" ]; then
            TAG_VER="1.1.1"
          fi
          bash scripts/build_multiabi_deb.sh "${TAG_VER}"
          bash scripts/build_dkms_deb.sh "${TAG_VER}"

      - name: Upload Universal packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-universal
          path: dist/*.deb

  release:
    name: Publish Release
    needs: [build-universal]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: deb-universal
          path: all_packages

      - name: List downloaded packages
        run: |
          ls -la all_packages/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_packages/*.deb
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
